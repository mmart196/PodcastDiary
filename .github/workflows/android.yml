name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Assemble + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          mkdir -p "$HOME/tools"
          unzip -q /tmp/gradle.zip -d "$HOME/tools"
          echo "$HOME/tools/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Generate stable debug keystore if missing
        id: keystore
        run: |
          set -e
          if [ -f app/debug.keystore ]; then
            echo "Existing app/debug.keystore found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Generating stable debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10950 \
              -keystore app/debug.keystore \
              -storepass android \
              -keypass android \
              -dname "CN=PodcastDiary Debug,O=PodcastDiary,C=US"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit keystore
        if: steps.keystore.outputs.generated == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "CI: add stable debug keystore for in-place updates [skip ci]"
          # Push to the branch that triggered the workflow.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed — see the test-reports artifact. APK was still built and uploaded."
          exit 1
